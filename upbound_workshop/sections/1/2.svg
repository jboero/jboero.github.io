<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="960" height="540" viewBox="0 0 960 540">
  <rect x="20" y="20" width="920" height="500" rx="24" fill="#140B33" fill-opacity="0.9" stroke="#8B6CFF" stroke-opacity="0.35" stroke-width="2"/>
  <image href="data:image/png;base64," x="872" y="40" width="52" height="52"/>
  <text x="60" y="84" font-family="Helvetica, Arial, sans-serif" font-size="18" font-weight="700" letter-spacing="3" fill="#8B6CFF">THE BIG IDEA</text>
  <text x="60" y="134" font-family="Helvetica, Arial, sans-serif" font-size="40" font-weight="700" fill="#B9A6FF">What are we actually building?</text>
  <rect x="60" y="152" width="120" height="5" rx="2.5" fill="#6B5BCD"/>
  <circle cx="72" cy="206" r="6" fill="#8B6CFF"/>
  <text x="94" y="214" font-family="Helvetica, Arial, sans-serif" font-size="24" font-weight="700" fill="#EDE9FF">You&#8217;re building a self-service API</text>
  <text x="94" y="239" font-family="Helvetica, Arial, sans-serif" font-size="18" fill="#7C6FAE">Not configuring a tool &#8212; you&#8217;re defining infrastructure as an API</text>
  <circle cx="72" cy="274" r="6" fill="#8B6CFF"/>
  <text x="94" y="282" font-family="Helvetica, Arial, sans-serif" font-size="24" font-weight="700" fill="#EDE9FF">The platform builder defines what &amp; how</text>
  <text x="94" y="307" font-family="Helvetica, Arial, sans-serif" font-size="18" fill="#7C6FAE">The request&#8217;s shape (XRD) and the logic behind it (Composition)</text>
  <circle cx="72" cy="342" r="6" fill="#8B6CFF"/>
  <text x="94" y="350" font-family="Helvetica, Arial, sans-serif" font-size="24" font-weight="700" fill="#EDE9FF">Developers submit one short request</text>
  <text x="94" y="375" font-family="Helvetica, Arial, sans-serif" font-size="18" fill="#7C6FAE">One kubectl apply in, real cloud resources out</text>
  <circle cx="72" cy="410" r="6" fill="#8B6CFF"/>
  <text x="94" y="418" font-family="Helvetica, Arial, sans-serif" font-size="24" font-weight="700" fill="#EDE9FF">It all lives in one project folder</text>
  <text x="94" y="443" font-family="Helvetica, Arial, sans-serif" font-size="18" fill="#7C6FAE">The unit you build and ship into a control plane</text>
  <text x="60" y="500" font-family="Helvetica, Arial, sans-serif" font-size="15" fill="#7C6FAE">2 / 17  &#8226;  Upbound Project Foundations &#8226; upbound.io</text>
</svg>

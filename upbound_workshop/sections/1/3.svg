<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="960" height="540" viewBox="0 0 960 540">
  <rect x="20" y="20" width="920" height="500" rx="24" fill="#140B33" fill-opacity="0.9" stroke="#8B6CFF" stroke-opacity="0.35" stroke-width="2"/>
  <image href="data:image/png;base64," x="872" y="40" width="52" height="52"/>
  <text x="60" y="84" font-family="Helvetica, Arial, sans-serif" font-size="18" font-weight="700" letter-spacing="3" fill="#8B6CFF">VOCABULARY</text>
  <text x="60" y="134" font-family="Helvetica, Arial, sans-serif" font-size="40" font-weight="700" fill="#B9A6FF">The five building blocks</text>
  <rect x="60" y="152" width="120" height="5" rx="2.5" fill="#6B5BCD"/>
  <circle cx="72" cy="184" r="6" fill="#8B6CFF"/>
  <text x="94" y="192" font-family="Helvetica, Arial, sans-serif" font-size="22" font-weight="700" fill="#EDE9FF">Composite Resource Definition &#8212; XRD</text>
  <text x="94" y="217" font-family="Helvetica, Arial, sans-serif" font-size="18" fill="#7C6FAE">The new resource TYPE you invent (the menu)</text>
  <circle cx="72" cy="238" r="6" fill="#8B6CFF"/>
  <text x="94" y="246" font-family="Helvetica, Arial, sans-serif" font-size="22" font-weight="700" fill="#EDE9FF">Composite Resource &#8212; XR</text>
  <text x="94" y="271" font-family="Helvetica, Arial, sans-serif" font-size="18" fill="#7C6FAE">One request filled out against that type (the order)</text>
  <circle cx="72" cy="292" r="6" fill="#8B6CFF"/>
  <text x="94" y="300" font-family="Helvetica, Arial, sans-serif" font-size="22" font-weight="700" fill="#EDE9FF">Composition</text>
  <text x="94" y="325" font-family="Helvetica, Arial, sans-serif" font-size="18" fill="#7C6FAE">The implementation that fulfils the request (the kitchen)</text>
  <circle cx="72" cy="346" r="6" fill="#8B6CFF"/>
  <text x="94" y="354" font-family="Helvetica, Arial, sans-serif" font-size="22" font-weight="700" fill="#EDE9FF">Provider</text>
  <text x="94" y="379" font-family="Helvetica, Arial, sans-serif" font-size="18" fill="#7C6FAE">Ships cloud resource types &amp; reconciles them (the pantry)</text>
  <circle cx="72" cy="400" r="6" fill="#8B6CFF"/>
  <text x="94" y="408" font-family="Helvetica, Arial, sans-serif" font-size="22" font-weight="700" fill="#EDE9FF">Managed Resource &#8212; MR</text>
  <text x="94" y="433" font-family="Helvetica, Arial, sans-serif" font-size="18" fill="#7C6FAE">One real cloud object, e.g. an actual S3 bucket (the dish)</text>
  <text x="60" y="460" font-family="Helvetica, Arial, sans-serif" font-size="15" fill="#7C6FAE">&#8220;X&#8221; = Composite &#8212; CR was already taken by Kubernetes.</text>
  <text x="60" y="480" font-family="Helvetica, Arial, sans-serif" font-size="15" fill="#7C6FAE">A CRD registers a new type with Kubernetes; the XRD generates one.</text>
  <text x="60" y="500" font-family="Helvetica, Arial, sans-serif" font-size="15" fill="#7C6FAE">3 / 17  &#8226;  Upbound Project Foundations &#8226; upbound.io</text>
</svg>

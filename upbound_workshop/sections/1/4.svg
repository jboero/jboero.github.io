<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="960" height="540" viewBox="0 0 960 540">
  <rect x="20" y="20" width="920" height="500" rx="24" fill="#140B33" fill-opacity="0.9" stroke="#8B6CFF" stroke-opacity="0.35" stroke-width="2"/>
  <image href="data:image/png;base64," x="872" y="40" width="52" height="52"/>
  <text x="60" y="84" font-family="Helvetica, Arial, sans-serif" font-size="18" font-weight="700" letter-spacing="3" fill="#8B6CFF">ROLES</text>
  <text x="60" y="134" font-family="Helvetica, Arial, sans-serif" font-size="40" font-weight="700" fill="#B9A6FF">Who does what?</text>
  <rect x="60" y="152" width="120" height="5" rx="2.5" fill="#6B5BCD"/>
  <rect x="60" y="196" width="300" height="118" rx="16" fill="#8AD3FF" fill-opacity="0.07" stroke="#8AD3FF" stroke-opacity="0.55" stroke-width="2"/>
  <text x="78" y="232" font-family="Helvetica, Arial, sans-serif" font-size="17" font-weight="700" fill="#8AD3FF">CONTROL-PLANE ADMIN</text>
  <text x="344" y="230" text-anchor="end" font-family="Helvetica, Arial, sans-serif" font-size="11" font-weight="700" letter-spacing="2" fill="#8AD3FF" opacity="0.75">SETUP</text>
  <text x="78" y="262" font-family="Helvetica, Arial, sans-serif" font-size="15" fill="#EDE9FF">Creates the control plane, installs</text>
  <text x="78" y="284" font-family="Helvetica, Arial, sans-serif" font-size="15" fill="#EDE9FF">providers, credentials and RBAC</text>
  <rect x="378" y="196" width="300" height="118" rx="16" fill="#B9A6FF" fill-opacity="0.07" stroke="#B9A6FF" stroke-opacity="0.55" stroke-width="2"/>
  <text x="396" y="232" font-family="Helvetica, Arial, sans-serif" font-size="17" font-weight="700" fill="#B9A6FF">PLATFORM BUILDER</text>
  <text x="662" y="230" text-anchor="end" font-family="Helvetica, Arial, sans-serif" font-size="11" font-weight="700" letter-spacing="2" fill="#B9A6FF" opacity="0.75">SETUP</text>
  <text x="396" y="262" font-family="Helvetica, Arial, sans-serif" font-size="15" fill="#EDE9FF">Authors the project: XRD,</text>
  <text x="396" y="284" font-family="Helvetica, Arial, sans-serif" font-size="15" fill="#EDE9FF">Composition and functions</text>
  <rect x="60" y="330" width="300" height="118" rx="16" fill="#FFC98A" fill-opacity="0.07" stroke="#FFC98A" stroke-opacity="0.55" stroke-width="2"/>
  <text x="78" y="366" font-family="Helvetica, Arial, sans-serif" font-size="17" font-weight="700" fill="#FFC98A">GITOPS / APPROVER</text>
  <text x="344" y="364" text-anchor="end" font-family="Helvetica, Arial, sans-serif" font-size="11" font-weight="700" letter-spacing="2" fill="#FFC98A" opacity="0.75">SHIP</text>
  <text x="78" y="396" font-family="Helvetica, Arial, sans-serif" font-size="15" fill="#EDE9FF">Reviews and merges the PR, then</text>
  <text x="78" y="418" font-family="Helvetica, Arial, sans-serif" font-size="15" fill="#EDE9FF">promotes dev &#8594; staging &#8594; prod</text>
  <rect x="378" y="330" width="300" height="118" rx="16" fill="#63D39B" fill-opacity="0.07" stroke="#63D39B" stroke-opacity="0.55" stroke-width="2"/>
  <text x="396" y="366" font-family="Helvetica, Arial, sans-serif" font-size="17" font-weight="700" fill="#63D39B">DEVELOPER</text>
  <text x="662" y="364" text-anchor="end" font-family="Helvetica, Arial, sans-serif" font-size="11" font-weight="700" letter-spacing="2" fill="#63D39B" opacity="0.75">APPLY</text>
  <text x="396" y="396" font-family="Helvetica, Arial, sans-serif" font-size="15" fill="#EDE9FF">Writes one XR and applies it,</text>
  <text x="396" y="418" font-family="Helvetica, Arial, sans-serif" font-size="15" fill="#EDE9FF">gets real infrastructure back</text>
  <text x="60" y="480" font-family="Helvetica, Arial, sans-serif" font-size="15" fill="#7C6FAE">This workshop stands in the platform builder&#8217;s shoes.</text>
  <text x="60" y="500" font-family="Helvetica, Arial, sans-serif" font-size="15" fill="#7C6FAE">4 / 17  &#8226;  Upbound Project Foundations &#8226; upbound.io</text>
</svg>

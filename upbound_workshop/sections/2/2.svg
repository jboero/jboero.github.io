<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="960" height="540" viewBox="0 0 960 540">
  <rect x="20" y="20" width="920" height="500" rx="24" fill="#140B33" fill-opacity="0.9" stroke="#8B6CFF" stroke-opacity="0.35" stroke-width="2"/>
  <image href="data:image/png;base64," x="872" y="40" width="52" height="52"/>
  <text x="60" y="84" font-family="Helvetica, Arial, sans-serif" font-size="18" font-weight="700" letter-spacing="3" fill="#8B6CFF">STRUCTURE</text>
  <text x="60" y="134" font-family="Helvetica, Arial, sans-serif" font-size="40" font-weight="700" fill="#B9A6FF">The project is a directory tree</text>
  <rect x="60" y="152" width="120" height="5" rx="2.5" fill="#6B5BCD"/>
  <rect x="682" y="64" width="168" height="25" rx="12" fill="#B9A6FF" fill-opacity="0.15" stroke="#B9A6FF" stroke-opacity="0.7" stroke-width="1.5"/>
  <text x="766" y="81" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="12" font-weight="700" letter-spacing="1.2" fill="#B9A6FF">PLATFORM BUILDER</text>
  <text x="72" y="204" font-family="Menlo, Consolas, monospace" font-size="19" fill="#EDE9FF" xml:space="preserve">upbound-hello-world/</text>
  <text x="72" y="233" font-family="Menlo, Consolas, monospace" font-size="19" fill="#EDE9FF" xml:space="preserve">&#9500;&#9472; upbound.yaml</text>
  <text x="470" y="233" font-family="Helvetica, Arial, sans-serif" font-size="16" fill="#7C6FAE">project config &#183; entry point</text>
  <text x="72" y="262" font-family="Menlo, Consolas, monospace" font-size="19" fill="#B9A6FF" xml:space="preserve">&#9500;&#9472; apis/</text>
  <text x="470" y="262" font-family="Helvetica, Arial, sans-serif" font-size="16" fill="#7C6FAE">YOUR API &#8212; built once  (SETUP)</text>
  <text x="72" y="291" font-family="Menlo, Consolas, monospace" font-size="19" fill="#EDE9FF" xml:space="preserve">&#9474;  &#9492;&#9472; storagebuckets/</text>
  <text x="72" y="320" font-family="Menlo, Consolas, monospace" font-size="19" fill="#EDE9FF" xml:space="preserve">&#9474;     &#9500;&#9472; definition.yaml</text>
  <text x="470" y="320" font-family="Helvetica, Arial, sans-serif" font-size="16" fill="#7C6FAE">XRD &#183; the type</text>
  <text x="72" y="349" font-family="Menlo, Consolas, monospace" font-size="19" fill="#EDE9FF" xml:space="preserve">&#9474;     &#9492;&#9472; composition.yaml</text>
  <text x="470" y="349" font-family="Helvetica, Arial, sans-serif" font-size="16" fill="#7C6FAE">Composition &#183; the logic</text>
  <text x="72" y="378" font-family="Menlo, Consolas, monospace" font-size="19" fill="#FFC98A" xml:space="preserve">&#9492;&#9472; examples/</text>
  <text x="470" y="378" font-family="Helvetica, Arial, sans-serif" font-size="16" fill="#7C6FAE">requests  (APPLY)</text>
  <text x="72" y="407" font-family="Menlo, Consolas, monospace" font-size="19" fill="#EDE9FF" xml:space="preserve">   &#9492;&#9472; storagebucket/</text>
  <text x="72" y="436" font-family="Menlo, Consolas, monospace" font-size="19" fill="#EDE9FF" xml:space="preserve">      &#9492;&#9472; example.yaml</text>
  <text x="470" y="436" font-family="Helvetica, Arial, sans-serif" font-size="16" fill="#7C6FAE">XR &#183; one request</text>
  <text x="72" y="470" font-family="Helvetica, Arial, sans-serif" font-size="16" fill="#7C6FAE">apis/ = set up once  &#8226;  examples/ = the requests that run again and again.</text>
  <text x="60" y="500" font-family="Helvetica, Arial, sans-serif" font-size="15" fill="#7C6FAE">6 / 17  &#8226;  Upbound Project Foundations &#8226; upbound.io</text>

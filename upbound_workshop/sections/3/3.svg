<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="960" height="540" viewBox="0 0 960 540">
  <rect x="20" y="20" width="920" height="500" rx="24" fill="#140B33" fill-opacity="0.9" stroke="#8B6CFF" stroke-opacity="0.35" stroke-width="2"/>
  <image href="data:image/png;base64," x="872" y="40" width="52" height="52"/>
  <text x="60" y="84" font-family="Helvetica, Arial, sans-serif" font-size="18" font-weight="700" letter-spacing="3" fill="#8B6CFF">BUILD &#183; STEP 3</text>
  <text x="60" y="134" font-family="Helvetica, Arial, sans-serif" font-size="40" font-weight="700" fill="#B9A6FF">Generate an example XR</text>
  <rect x="60" y="152" width="120" height="5" rx="2.5" fill="#6B5BCD"/>
  <rect x="60" y="188" width="840" height="116" rx="10" fill="#0C0722" stroke="#8B6CFF" stroke-opacity="0.4" stroke-width="1.5"/>
  <text x="78" y="218" font-family="Menlo, Consolas, monospace" font-size="16" fill="#CFC6FF" xml:space="preserve">$ up example generate --type xr \</text>
  <text x="78" y="242" font-family="Menlo, Consolas, monospace" font-size="16" fill="#CFC6FF" xml:space="preserve">    --api-group platform.example.com --kind StorageBucket \</text>
  <text x="78" y="266" font-family="Menlo, Consolas, monospace" font-size="16" fill="#CFC6FF" xml:space="preserve">    --api-version v1alpha1 --name example \</text>
  <text x="78" y="290" font-family="Menlo, Consolas, monospace" font-size="16" fill="#CFC6FF" xml:space="preserve">    --namespace default --scope namespace</text>
  <circle cx="72" cy="342" r="6" fill="#8B6CFF"/>
  <text x="94" y="350" font-family="Helvetica, Arial, sans-serif" font-size="21" font-weight="700" fill="#EDE9FF">Writes a sample request to examples/</text>
  <text x="94" y="375" font-family="Helvetica, Arial, sans-serif" font-size="18" fill="#7C6FAE">This is the request we WISH existed</text>
  <circle cx="72" cy="394" r="6" fill="#8B6CFF"/>
  <text x="94" y="402" font-family="Helvetica, Arial, sans-serif" font-size="21" font-weight="700" fill="#EDE9FF">Design the API by using it first</text>
  <text x="94" y="427" font-family="Helvetica, Arial, sans-serif" font-size="18" fill="#7C6FAE">Next step derives the type from this example</text>
  <text x="60" y="474" font-family="Helvetica, Arial, sans-serif" font-size="15" fill="#7C6FAE">Request-first design: fill in spec.parameters (region, versioning, acl) &#8212; the knobs your users get.</text>
  <text x="60" y="500" font-family="Helvetica, Arial, sans-serif" font-size="15" fill="#7C6FAE">Upbound Project Foundations &#8226; upbound.io</text>
  <text x="900" y="500" text-anchor="end" font-family="Helvetica, Arial, sans-serif" font-size="15" fill="#7C6FAE">9 / 14</text>
</svg>

<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="960" height="540" viewBox="0 0 960 540">
  <rect x="20" y="20" width="920" height="500" rx="24" fill="#140B33" fill-opacity="0.88" stroke="#8B6CFF" stroke-opacity="0.35" stroke-width="2"/>
  <text x="60" y="86" font-family="Helvetica, Arial, sans-serif" font-size="19" font-weight="700" letter-spacing="3" fill="#8B6CFF">THE PROBLEM</text>
  <text x="60" y="138" font-family="Helvetica, Arial, sans-serif" font-size="42" font-weight="700" fill="#B9A6FF">Cloud operations don&#8217;t scale by hand</text>
  <rect x="60" y="158" width="120" height="5" rx="2.5" fill="#6B5BCD"/>
  <circle cx="72" cy="207" r="6" fill="#8B6CFF"/>
  <text x="94" y="215" font-family="Helvetica, Arial, sans-serif" font-size="25" font-weight="700" fill="#EDE9FF">Ticket-driven infrastructure slows every team</text>
  <text x="94" y="242" font-family="Helvetica, Arial, sans-serif" font-size="19" fill="#7C6FAE">Days or weeks to provision what apps need today</text>
  <circle cx="72" cy="269" r="6" fill="#8B6CFF"/>
  <text x="94" y="277" font-family="Helvetica, Arial, sans-serif" font-size="25" font-weight="700" fill="#EDE9FF">Tool and script sprawl across clouds</text>
  <text x="94" y="304" font-family="Helvetica, Arial, sans-serif" font-size="19" fill="#7C6FAE">Terraform here, consoles there &#8212; no single source of truth</text>
  <circle cx="72" cy="331" r="6" fill="#8B6CFF"/>
  <text x="94" y="339" font-family="Helvetica, Arial, sans-serif" font-size="25" font-weight="700" fill="#EDE9FF">Configuration drift goes unchecked</text>
  <text x="94" y="366" font-family="Helvetica, Arial, sans-serif" font-size="19" fill="#7C6FAE">What&#8217;s running no longer matches what was declared</text>
  <circle cx="72" cy="393" r="6" fill="#8B6CFF"/>
  <text x="94" y="401" font-family="Helvetica, Arial, sans-serif" font-size="25" font-weight="700" fill="#EDE9FF">Platform teams become the bottleneck</text>
  <text x="94" y="428" font-family="Helvetica, Arial, sans-serif" font-size="19" fill="#7C6FAE">Experts stuck fielding requests instead of building</text>
  <circle cx="880" cy="58.0" r="7.0" fill="#FFFFFF"/>
  <text x="871.0" y="84" font-family="Helvetica, Arial, sans-serif" font-size="34.0" font-weight="700" fill="#FFFFFF">up</text>
  <text x="60" y="492" font-family="Helvetica, Arial, sans-serif" font-size="15" fill="#7C6FAE">Upbound &#8226; upbound.io</text>
  <text x="900" y="492" text-anchor="end" font-family="Helvetica, Arial, sans-serif" font-size="15" fill="#7C6FAE">2 / 10</text>
</svg>

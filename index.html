  :root {
    --bg: #0d1117;
    --surface: #161b22;
    --border: #30363d;
    --text: #c9d1d9;
    --text-dim: #8b949e;
    --accent: #58a6ff;
    --accent2: #f778ba;
    --accent3: #7ee787;
    --glow: rgba(88, 166, 255, 0.15);
  }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    font-family: 'JetBrains Mono', 'Fira Code', 'SF Mono', monospace;
    background: var(--bg);
    color: var(--text);
    min-height: 100vh;
    padding: 2rem;
  }
  /* Animated gradient border at top */
  body::before {
    content: '';
    position: fixed;
    top: 0; left: 0; right: 0;
    height: 3px;
    background: linear-gradient(90deg, var(--accent), var(--accent2), var(--accent3), var(--accent));
    background-size: 300% 100%;
    animation: gradient-slide 4s linear infinite;
    z-index: 100;
  }
  @keyframes gradient-slide {
    0% { background-position: 0% 50%; }
    100% { background-position: 300% 50%; }
  }

  .container {
    max-width: 900px;
    margin: 0 auto;
  }
  header {
    margin-bottom: 2rem;
    padding-bottom: 1rem;
    border-bottom: 1px solid var(--border);
  }
  header h1 {
    font-size: 1.4rem;
    font-weight: 600;
    color: var(--text);
  }
  header h1 .prompt { color: var(--accent3); }
  header h1 .path { color: var(--accent); }
  header .subtitle {
    font-size: 0.8rem;
    color: var(--text-dim);
    margin-top: 0.4rem;
  }

  table {
    width: 100%;
    border-collapse: collapse;
    border: 1px solid var(--border);
    border-radius: 8px;
    overflow: hidden;
    background: var(--surface);
  }
  thead th {
    text-align: left;
    padding: 0.7rem 1rem;
    font-size: 0.75rem;
    text-transform: uppercase;
    letter-spacing: 0.05em;
    color: var(--text-dim);
    border-bottom: 1px solid var(--border);
    background: var(--bg);
    cursor: pointer;
    user-select: none;
  }
  thead th:hover { color: var(--accent); }
  tbody tr {
    border-bottom: 1px solid var(--border);
    transition: background 0.15s;
  }
  tbody tr:last-child { border-bottom: none; }
  tbody tr:hover {
    background: var(--glow);
  }
  td {
    padding: 0.6rem 1rem;
    font-size: 0.85rem;
    white-space: nowrap;
  }
  .icon-cell { width: 2.5rem; text-align: center; }
  .size-cell, .date-cell { color: var(--text-dim); text-align: right; }
  .name-cell a {
    color: var(--accent);
    text-decoration: none;
    transition: color 0.15s;
  }
  .name-cell a:hover {
    color: var(--accent2);
    text-decoration: underline;
  }

  /* Icons via CSS — no external deps */
  .icon {
    display: inline-block;
    width: 18px; height: 18px;
    vertical-align: middle;
    border-radius: 3px;
  }

  .icon-html     { background: #e44d26; }
  .icon-css      { background: #264de4; }
  .icon-js       { background: #f7df1e; border-radius: 3px; }
  .icon-python   { background: #3776ab; }
  .icon-terminal { background: var(--accent3); }
  .icon-doc      { background: var(--text-dim); }
  .icon-config   { background: #f0883e; }
  .icon-image    { background: var(--accent2); }
  .icon-video    { background: #bc8cff; }
  .icon-archive  { background: #f0883e; }

  footer {
    margin-top: 2rem;
    padding-top: 1rem;
    border-top: 1px solid var(--border);
    font-size: 0.7rem;
    color: var(--text-dim);
    display: flex;
    justify-content: space-between;
  }

  /* Scanline overlay for extra retro flavor */
  body::after {
    content: '';
    position: fixed;
    inset: 0;
    background: repeating-linear-gradient(
      0deg,
      transparent,
      transparent 2px,
      rgba(0,0,0,0.03) 2px,
      rgba(0,0,0,0.03) 4px
    );
    pointer-events: none;
    z-index: 99;
  }

  @media (max-width: 600px) {
    body { padding: 1rem; }
    .date-cell { display: none; }
    td { padding: 0.5rem 0.6rem; }
  }
</style>

<script>
  // Format timestamps
  document.querySelectorAll('.date-cell[data-ts]').forEach(el => {
    const ts = parseInt(el.dataset.ts, 10);
    if (!ts) return;
    const d = new Date(ts * 1000);
    el.textContent = d.toLocaleDateString('en-US', {
      year: 'numeric', month: 'short', day: 'numeric',
      hour: '2-digit', minute: '2-digit'
    });
  });
  // Live clock in footer
  const clock = document.getElementById('clock');
  if (clock) setInterval(() => {
    clock.textContent = new Date().toLocaleTimeString();
  }, 1000);
</script>

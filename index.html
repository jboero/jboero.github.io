<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Presentations &middot; jboero</title>
<style>
  :root {
    --bg:        #0d0b08;
    --surface:   #1a1611;
    --card:      #14110d;
    --border:    #2e271c;
    --border-hi: #6b4e1f;
    --amber:     #e8a13c;
    --amber-dim: #b9822f;
    --text:      #ece4d6;
    --text-dim:  #9a8f7c;
    --text-mute: #6b6253;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; padding: 0; }
  body {
    background: var(--bg);
    color: var(--text);
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 2rem 1rem;
    position: relative;
    overflow-x: hidden;
  }
  /* subtle CRT scanline overlay */
  body::after {
    content: "";
    position: fixed;
    inset: 0;
    pointer-events: none;
    background: repeating-linear-gradient(
      to bottom,
      rgba(255,255,255,0.018) 0px,
      rgba(255,255,255,0.018) 1px,
      transparent 1px,
      transparent 3px
    );
    z-index: 9999;
  }
  .wrap { width: 100%; max-width: 640px; }
  .panel {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 14px;
    padding: 2rem 1.75rem;
    position: relative;
    overflow: hidden;
  }
  .head { display: flex; align-items: center; gap: 12px; margin-bottom: 6px; }
  .head svg { width: 24px; height: 24px; flex-shrink: 0; }
  #title {
    font-size: 24px;
    font-weight: 500;
    letter-spacing: 0.5px;
    color: var(--text);
    min-height: 30px;
  }
  #title::after {
    content: "_";
    color: var(--amber);
    animation: blink 1s step-end infinite;
  }
  #title.done::after { content: ""; }
  @keyframes blink { 50% { opacity: 0; } }
  .intro {
    font-size: 14px;
    line-height: 1.75;
    color: var(--text-dim);
    margin: 0 0 1.75rem;
  }
  .intro em { color: var(--amber-dim); font-style: normal; }
  .cards { display: flex; flex-direction: column; gap: 8px; }
  .card {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 12px;
    text-decoration: none;
    padding: 13px 15px;
    background: var(--card);
    border: 1px solid var(--border);
    border-radius: 9px;
    opacity: 0;
    transform: translateY(8px);
    transition: opacity .4s ease, transform .18s ease, border-color .18s ease, box-shadow .18s ease;
  }
  .card.in { opacity: 1; transform: translateY(0); }
  .card:hover {
    transform: translateY(-2px);
    border-color: var(--border-hi);
    box-shadow: 0 4px 18px -6px rgba(232,161,60,0.35), 0 0 0 1px rgba(232,161,60,0.15);
  }
  .card .left { display: flex; align-items: center; gap: 11px; min-width: 0; }
  .card .dot {
    width: 8px; height: 8px; border-radius: 50%;
    background: var(--amber-dim);
    flex-shrink: 0;
    transition: background .18s ease, box-shadow .18s ease;
  }
  .card:hover .dot { background: var(--amber); box-shadow: 0 0 8px var(--amber); }
  .card .meta { display: flex; flex-direction: column; min-width: 0; }
  .card .name { font-size: 15px; font-weight: 500; color: var(--text); }
  .card .slug {
    font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
    font-size: 12px; color: var(--text-mute);
  }
  .card .arrow {
    color: var(--text-mute);
    font-size: 18px; line-height: 1;
    transition: transform .18s ease, color .18s ease;
    flex-shrink: 0;
  }
  .card:hover .arrow { transform: translateX(4px); color: var(--amber); }
  .foot {
    text-align: center;
    font-size: 12px;
    color: var(--text-mute);
    margin-top: 1.1rem;
    font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
  }
</style>
</head>
<body>
  <div class="wrap">
    <div class="panel">
      <div class="head">
        <svg viewBox="0 0 24 24" fill="none" stroke="#e8a13c" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round">
          <path d="M3 4h18"/><path d="M4 4v10a1 1 0 0 0 1 1h14a1 1 0 0 0 1-1V4"/>
          <path d="M12 15v4"/><path d="M9 19h6"/>
        </svg>
        <span id="title"></span>
      </div>
      <p class="intro">
        A hosting place for my static Reveal.js presentations. Feel free to copy or modify any samples here &mdash; but please don't copy any of the <em>3D model files</em>, which may be copyrighted. Replace them with your own.
      </p>
      <div class="cards" id="cards"></div>
    </div>
    <p class="foot">jboero.github.io</p>
  </div>

<script>
(function () {
  var decks = [
    { name: "BrynzAI",                  slug: "brynzai" },
    { name: "Change Inspire, Tbilisi",  slug: "chinspire" },
    { name: "Cloud Native Media",       slug: "cnm" },
    { name: "DevOps London",            slug: "dolon" },
    { name: "DevOps Exchange London",   slug: "doxlon" },
    { name: "DevSecOps London",         slug: "dsolg" },
    { name: "RISC-V Conf, Santa Clara", slug: "riscv" },
    { name: "Upbound",                  slug: "upbound" },
    { name: "Upbound Workshop",         slug: "upbound_workshop" },
    { name: "Zero Trust",               slug: "zt" }
  ];

  var box = document.getElementById("cards");
  decks.forEach(function (d) {
    var a = document.createElement("a");
    a.className = "card";
    a.href = "https://jboero.github.io/" + d.slug;
    a.innerHTML =
      '<span class="left">' +
        '<span class="dot"></span>' +
        '<span class="meta">' +
          '<span class="name">' + d.name + '</span>' +
          '<span class="slug">/' + d.slug + '</span>' +
        '</span>' +
      '</span>' +
      '<span class="arrow">&rarr;</span>';
    box.appendChild(a);
  });

  var title = "Presentations";
  var el = document.getElementById("title");
  var i = 0;
  function type() {
    if (i <= title.length) {
      el.textContent = title.slice(0, i);
      i++;
      setTimeout(type, 55);
    } else {
      el.classList.add("done");
      var cards = document.querySelectorAll(".card");
      cards.forEach(function (c, idx) {
        setTimeout(function () { c.classList.add("in"); }, idx * 70);
      });
    }
  }
  type();
})();
</script>
</body>
</html>

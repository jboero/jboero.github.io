<!doctype html>
<html lang="en">

<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Asterkube — Secure Kubernetes without Linux or C</title>

  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />

  <link rel="stylesheet" href="vendor/reveal.css">
  <link rel="stylesheet" href="css/custom.css">
</head>

<body>

  <!-- Spinning Upbound cube (WebGL) sits behind the slides -->
  <div id="background"></div>

  <div class="reveal">
    <div class="slides" id="slides"></div>
  </div>

  <!-- Reveal.js 5 (UMD build exposes the global `Reveal`) -->
  <script src="vendor/reveal.js"></script>

  <!-- Background cube + slide loader. ES module so we can import modern three.js. -->
  <script type="module">
    import * as THREE from './vendor/three.module.min.js';

    /* =========================================================================
       Upbound spinning-cube background
       An oversized cube, offset right and pivoted on Y, textured on all six
       faces with the official Upbound logo. It spins slowly about its local X
       axis so the logo always rises upright (six-plane build keeps each face's
       texture "up" aligned to the roll). Blurred via CSS in css/custom.css.
       ========================================================================= */
    const UB_SIZE   = 7;      // cube edge length (oversized; overflows top/bottom)
    const UB_OFFSET = 2.2;    // world X offset -> pushes the cube to the right
    const UB_DEPTH  = 3;      // world Z toward the camera -> larger / closer
    const UB_TILT   = -25;    // degrees pivoted on Y (applied before the spin)
    const UB_SPEED  = 0.0006; // X-axis spin per frame (~180s per revolution)

    let cam, scene, renderer, cube;

    function initCube() {
      const container = document.getElementById('background');

      cam = new THREE.PerspectiveCamera(45, innerWidth / innerHeight, 1, 2000);
      cam.position.set(0, 0, 12);
      cam.lookAt(0, 0, 0);

      scene = new THREE.Scene();

      const tex = new THREE.TextureLoader().load('images/upbound_avatar.png');
      tex.minFilter = THREE.LinearFilter;
      tex.colorSpace = THREE.SRGBColorSpace;   // render the brand purple true
      tex.anisotropy = 8;

      const material = new THREE.MeshPhongMaterial({
        map: tex, color: 0xffffff, specular: 0x2a2350, shininess: 16
      });

      // Six individually-oriented planes so the logo stays upright as it rolls.
      // Row: [face normal], [texture-up along the roll tangent], [face position].
      const half = UB_SIZE / 2;
      cube = new THREE.Object3D();
      const faces = [
        [[0, 0, 1],  [0, 1, 0],  [0, 0, half]],   // +Z front
        [[0, 1, 0],  [0, 0, -1], [0, half, 0]],   // +Y top
        [[0, 0, -1], [0, -1, 0], [0, 0, -half]],  // -Z back
        [[0, -1, 0], [0, 0, 1],  [0, -half, 0]],  // -Y bottom
        [[1, 0, 0],  [0, 1, 0],  [half, 0, 0]],   // +X right (spin axis)
        [[-1, 0, 0], [0, 1, 0],  [-half, 0, 0]]   // -X left  (spin axis)
      ];
      for (const f of faces) {
        const N = new THREE.Vector3().fromArray(f[0]);
        const U = new THREE.Vector3().fromArray(f[1]);
        const R = new THREE.Vector3().crossVectors(U, N);   // right = up x normal
        const m = new THREE.Matrix4().set(
          R.x, U.x, N.x, 0,
          R.y, U.y, N.y, 0,
          R.z, U.z, N.z, 0,
          0,   0,   0,   1);
        const face = new THREE.Mesh(new THREE.PlaneGeometry(UB_SIZE, UB_SIZE), material);
        face.quaternion.setFromRotationMatrix(m);
        face.position.fromArray(f[2]);
        cube.add(face);
      }

      // Pivot group: Y tilt first, then the cube spins on its local X.
      const pivot = new THREE.Object3D();
      pivot.position.set(UB_OFFSET, 0, UB_DEPTH);
      pivot.rotation.y = THREE.MathUtils.degToRad(UB_TILT);
      pivot.add(cube);
      scene.add(pivot);

      // Neutral lighting so the purple reads true; angled faces fall off for depth.
      scene.add(new THREE.AmbientLight(0xffffff, 1.1));
      const key = new THREE.DirectionalLight(0xffffff, 2.2);
      key.position.set(-0.6, 1, 1.4);
      scene.add(key);
      const fill = new THREE.DirectionalLight(0xffffff, 0.6);
      fill.position.set(1, -0.4, 0.6);
      scene.add(fill);

      renderer = new THREE.WebGLRenderer({ alpha: true, antialias: true });
      renderer.setPixelRatio(devicePixelRatio);
      renderer.setSize(innerWidth, innerHeight);
      container.appendChild(renderer.domElement);

      addEventListener('resize', () => {
        cam.aspect = innerWidth / innerHeight;
        cam.updateProjectionMatrix();
        renderer.setSize(innerWidth, innerHeight);
      });
    }

    function animate() {
      requestAnimationFrame(animate);
      cube.rotation.x -= UB_SPEED;   // pure local-X spin (rides the Y tilt)
      renderer.render(scene, cam);
    }

    initCube();
    animate();

    /* =========================================================================
       Slide loader
       Slides are per-file SVGs under sections/<col>/<row>.svg. Each numbered
       directory is a horizontal column; the SVGs in it are vertical slides.
       Columns 1-3 are content, column 4 is reusable templates.
       ========================================================================= */
    const SECTIONS = 4;

    async function buildSlides() {
      const slidesEl = document.getElementById('slides');
      for (let col = 1; col <= SECTIONS; col++) {
        const column = document.createElement('section');
        for (let row = 1; row < 10; row++) {
          const url = `sections/${col}/${row}.svg`;
          let found = false;
          try { found = (await fetch(url, { method: 'HEAD' })).ok; } catch (e) { found = false; }
          if (!found) break;
          const slide = document.createElement('section');
          const img = document.createElement('img');
          img.src = url;
          slide.appendChild(img);
          column.appendChild(slide);
        }
        if (column.children.length) slidesEl.appendChild(column);
      }
    }

    await buildSlides();

    Reveal.initialize({
      width: 960,
      height: 540,
      margin: 0,
      minScale: 0.2,
      maxScale: 2.0,
      controls: false,
      progress: true,
      hash: true,
      transition: 'slide'
    });
  </script>
</body>

</html>

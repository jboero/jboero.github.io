<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="960" height="540" viewBox="0 0 960 540">
  <rect x="20" y="20" width="920" height="500" rx="24" fill="#140B33" fill-opacity="0.9" stroke="#8B6CFF" stroke-opacity="0.35" stroke-width="2"/>
  <image href="data:image/png;base64," x="872" y="40" width="52" height="52"/>
  <text x="60" y="84" font-family="Helvetica, Arial, sans-serif" font-size="18" font-weight="700" letter-spacing="3" fill="#8B6CFF">THE ARTIFACT</text>
  <text x="60" y="134" font-family="Helvetica, Arial, sans-serif" font-size="40" font-weight="700" fill="#B9A6FF">The image: ~40 MB, boots &lt; 5 s, zero C</text>
  <rect x="60" y="152" width="120" height="5" rx="2.5" fill="#6B5BCD"/>
  <text x="90" y="206" font-family="Menlo, Consolas, monospace" font-size="17" fill="#EDE9FF">kernel ELF (stripped)</text>
  <text x="560" y="206" text-anchor="end" font-family="Menlo, Consolas, monospace" font-size="17" fill="#EDE9FF">5.3 MiB</text>
  <text x="90" y="236" font-family="Menlo, Consolas, monospace" font-size="17" fill="#EDE9FF">initramfs.cpio.zst (--ultra -22)</text>
  <text x="560" y="236" text-anchor="end" font-family="Menlo, Consolas, monospace" font-size="17" fill="#EDE9FF">26.4 MiB</text>
  <text x="580" y="236" font-family="Helvetica, Arial, sans-serif" font-size="15" fill="#7C6FAE">&#8722;40% vs gzip</text>
  <text x="90" y="266" font-family="Menlo, Consolas, monospace" font-size="17" fill="#EDE9FF">bootable ISO (isohybrid)</text>
  <text x="560" y="266" text-anchor="end" font-family="Menlo, Consolas, monospace" font-size="17" fill="#EDE9FF">40.6 MiB</text>
  <text x="90" y="296" font-family="Menlo, Consolas, monospace" font-size="17" fill="#EDE9FF">QCOW2 disk image</text>
  <text x="560" y="296" text-anchor="end" font-family="Menlo, Consolas, monospace" font-size="17" fill="#EDE9FF">38.2 MiB</text>
  <line x1="90" y1="318" x2="880" y2="318" stroke="#8B6CFF" stroke-opacity="0.2" stroke-width="1"/>
  <text x="90" y="340" font-family="Menlo, Consolas, monospace" font-size="17" fill="#EDE9FF">usr/bin/kubelet</text>
  <text x="560" y="340" text-anchor="end" font-family="Menlo, Consolas, monospace" font-size="17" fill="#EDE9FF">79.1 MiB</text>
  <text x="580" y="340" font-family="Helvetica, Arial, sans-serif" font-size="15" fill="#7C6FAE">kubelet + init + runc + mount + DHCP</text>
  <text x="90" y="370" font-family="Menlo, Consolas, monospace" font-size="17" fill="#EDE9FF">usr/bin/containerd</text>
  <text x="560" y="370" text-anchor="end" font-family="Menlo, Consolas, monospace" font-size="17" fill="#EDE9FF">42.7 MiB</text>
  <text x="580" y="370" font-family="Helvetica, Arial, sans-serif" font-size="15" fill="#7C6FAE">merged containerd + ctr</text>
  <text x="90" y="400" font-family="Menlo, Consolas, monospace" font-size="17" fill="#EDE9FF">usr/bin/containerd-shim-runc-v2</text>
  <text x="560" y="400" text-anchor="end" font-family="Menlo, Consolas, monospace" font-size="17" fill="#EDE9FF">13.9 MiB</text>
  <text x="90" y="430" font-family="Menlo, Consolas, monospace" font-size="17" fill="#63D39B">usr/lib64/</text>
  <text x="560" y="430" text-anchor="end" font-family="Menlo, Consolas, monospace" font-size="17" fill="#63D39B">empty</text>
  <text x="580" y="430" font-family="Helvetica, Arial, sans-serif" font-size="15" fill="#7C6FAE">&#9668; the zero-C proof</text>
  <text x="90" y="470" font-family="Helvetica, Arial, sans-serif" font-size="16" fill="#B9A6FF">Three static, CGO-free Go binaries are the entire userspace. Empty /lib64 = no C runtime.</text>
  <text x="60" y="500" font-family="Helvetica, Arial, sans-serif" font-size="15" fill="#7C6FAE">Asterkube &#8226; Secure Kubernetes without Linux or C</text>
  <text x="900" y="500" text-anchor="end" font-family="Helvetica, Arial, sans-serif" font-size="15" fill="#7C6FAE">6 / 14</text>
</svg>

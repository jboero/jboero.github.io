<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>RYA Yachtmaster Quiz</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Libre+Baskerville:ital,wght@0,400;0,700;1,400&family=Source+Sans+3:wght@300;400;500;600&display=swap" rel="stylesheet">
    <style>
        :root {
            --navy-deep: #0a1628;
            --navy-mid: #162544;
            --navy-light: #1e3a5f;
            --gold: #c9a227;
            --gold-light: #e6c65c;
            --cream: #f5f1e6;
            --cream-dark: #e8e2d3;
            --sea-green: #2d8a7b;
            --coral: #e05858;
            --white: #ffffff;
            --text-dark: #1a1a1a;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Source Sans 3', sans-serif;
            background: var(--navy-deep);
            min-height: 100vh;
            color: var(--cream);
            line-height: 1.6;
        }

        .bg-pattern {
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: 
                radial-gradient(circle at 20% 80%, rgba(45, 138, 123, 0.1) 0%, transparent 50%),
                radial-gradient(circle at 80% 20%, rgba(201, 162, 39, 0.08) 0%, transparent 50%),
                linear-gradient(180deg, var(--navy-deep) 0%, var(--navy-mid) 100%);
            z-index: -1;
        }

        .bg-pattern::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background-image: url("data:image/svg+xml,%3Csvg width='60' height='60' viewBox='0 0 60 60' xmlns='http://www.w3.org/2000/svg'%3E%3Cpath d='M30 5 L32 28 L55 30 L32 32 L30 55 L28 32 L5 30 L28 28 Z' fill='none' stroke='%23c9a227' stroke-width='0.5' opacity='0.05'/%3E%3C/svg%3E");
            background-size: 120px 120px;
            opacity: 0.5;
        }

        .container {
            max-width: 900px;
            margin: 0 auto;
            padding: 20px;
            position: relative;
            z-index: 1;
        }

        header {
            text-align: center;
            padding: 40px 20px;
            border-bottom: 1px solid rgba(201, 162, 39, 0.3);
            margin-bottom: 40px;
        }

        .logo {
            width: 80px;
            height: 80px;
            margin: 0 auto 20px;
            animation: rotate 60s linear infinite;
        }

        @keyframes rotate {
            from { transform: rotate(0deg); }
            to { transform: rotate(360deg); }
        }

        h1 {
            font-family: 'Libre Baskerville', serif;
            font-size: clamp(1.8rem, 5vw, 2.8rem);
            color: var(--cream);
            margin-bottom: 10px;
            letter-spacing: 2px;
        }

        .subtitle {
            font-size: 1rem;
            color: var(--gold);
            text-transform: uppercase;
            letter-spacing: 4px;
            font-weight: 300;
        }

        .score-bar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            background: var(--navy-mid);
            padding: 15px 25px;
            border-radius: 12px;
            margin-bottom: 30px;
            border: 1px solid rgba(201, 162, 39, 0.2);
            flex-wrap: wrap;
            gap: 15px;
        }

        .score-item {
            text-align: center;
        }

        .score-label {
            font-size: 0.75rem;
            text-transform: uppercase;
            letter-spacing: 2px;
            color: rgba(245, 241, 230, 0.6);
            margin-bottom: 5px;
        }

        .score-value {
            font-family: 'Libre Baskerville', serif;
            font-size: 1.5rem;
            color: var(--gold);
        }

        .progress-container {
            flex: 1;
            min-width: 200px;
        }

        .progress-bar {
            height: 8px;
            background: rgba(245, 241, 230, 0.1);
            border-radius: 4px;
            overflow: hidden;
            margin-top: 8px;
        }

        .progress-fill {
            height: 100%;
            background: linear-gradient(90deg, var(--sea-green), var(--gold));
            border-radius: 4px;
            transition: width 0.5s ease;
        }

        .question-card {
            background: linear-gradient(145deg, var(--navy-mid), var(--navy-light));
            border-radius: 16px;
            padding: 35px;
            margin-bottom: 25px;
            border: 1px solid rgba(201, 162, 39, 0.15);
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.3);
            animation: slideIn 0.4s ease-out;
        }

        @keyframes slideIn {
            from {
                opacity: 0;
                transform: translateY(20px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .question-header {
            display: flex;
            justify-content: space-between;
            align-items: flex-start;
            margin-bottom: 25px;
            flex-wrap: wrap;
            gap: 10px;
        }

        .question-category {
            background: rgba(201, 162, 39, 0.15);
            color: var(--gold);
            padding: 6px 14px;
            border-radius: 20px;
            font-size: 0.75rem;
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        .question-number {
            font-family: 'Libre Baskerville', serif;
            font-size: 0.9rem;
            color: rgba(245, 241, 230, 0.5);
        }

        .question-text {
            font-family: 'Libre Baskerville', serif;
            font-size: clamp(1.1rem, 3vw, 1.4rem);
            line-height: 1.7;
            margin-bottom: 25px;
            color: var(--cream);
        }

        .question-image {
            margin: 25px 0;
            text-align: center;
        }

        .question-image svg,
        .question-image img {
            max-width: 100%;
            height: auto;
            border-radius: 12px;
            background: var(--navy-deep);
            padding: 20px;
        }

        .image-caption {
            font-size: 0.85rem;
            color: rgba(245, 241, 230, 0.6);
            margin-top: 10px;
            font-style: italic;
        }

        .options {
            display: flex;
            flex-direction: column;
            gap: 12px;
        }

        .option {
            display: flex;
            align-items: center;
            padding: 18px 22px;
            background: rgba(10, 22, 40, 0.6);
            border: 2px solid rgba(245, 241, 230, 0.1);
            border-radius: 12px;
            cursor: pointer;
            transition: all 0.3s ease;
            position: relative;
            overflow: hidden;
        }

        .option:hover:not(.disabled) {
            border-color: var(--gold);
            background: rgba(201, 162, 39, 0.1);
            transform: translateX(5px);
        }

        .option.selected {
            border-color: var(--gold);
            background: rgba(201, 162, 39, 0.15);
        }

        .option.correct {
            border-color: var(--sea-green);
            background: rgba(45, 138, 123, 0.2);
        }

        .option.incorrect {
            border-color: var(--coral);
            background: rgba(224, 88, 88, 0.2);
        }

        .option.disabled {
            cursor: default;
            opacity: 0.7;
        }

        .option-letter {
            width: 36px;
            height: 36px;
            display: flex;
            align-items: center;
            justify-content: center;
            background: rgba(201, 162, 39, 0.2);
            border-radius: 50%;
            margin-right: 15px;
            font-family: 'Libre Baskerville', serif;
            font-weight: 700;
            color: var(--gold);
            flex-shrink: 0;
        }

        .option.correct .option-letter {
            background: var(--sea-green);
            color: var(--white);
        }

        .option.incorrect .option-letter {
            background: var(--coral);
            color: var(--white);
        }

        .option-text {
            flex: 1;
            font-size: 1rem;
        }

        .feedback {
            margin-top: 25px;
            padding: 20px;
            border-radius: 12px;
            animation: fadeIn 0.3s ease;
        }

        @keyframes fadeIn {
            from { opacity: 0; }
            to { opacity: 1; }
        }

        .feedback.correct {
            background: rgba(45, 138, 123, 0.15);
            border-left: 4px solid var(--sea-green);
        }

        .feedback.incorrect {
            background: rgba(224, 88, 88, 0.15);
            border-left: 4px solid var(--coral);
        }

        .feedback-title {
            font-family: 'Libre Baskerville', serif;
            font-size: 1.1rem;
            margin-bottom: 10px;
        }

        .feedback.correct .feedback-title {
            color: var(--sea-green);
        }

        .feedback.incorrect .feedback-title {
            color: var(--coral);
        }

        .feedback-text {
            color: rgba(245, 241, 230, 0.85);
            font-size: 0.95rem;
        }

        .nav-buttons {
            display: flex;
            justify-content: space-between;
            gap: 15px;
            flex-wrap: wrap;
        }

        .btn {
            padding: 14px 32px;
            border: none;
            border-radius: 8px;
            font-family: 'Source Sans 3', sans-serif;
            font-size: 1rem;
            font-weight: 500;
            cursor: pointer;
            transition: all 0.3s ease;
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        .btn-primary {
            background: linear-gradient(135deg, var(--gold), var(--gold-light));
            color: var(--navy-deep);
        }

        .btn-primary:hover {
            transform: translateY(-2px);
            box-shadow: 0 8px 25px rgba(201, 162, 39, 0.3);
        }

        .btn-secondary {
            background: transparent;
            color: var(--cream);
            border: 2px solid rgba(245, 241, 230, 0.3);
        }

        .btn-secondary:hover {
            border-color: var(--cream);
            background: rgba(245, 241, 230, 0.1);
        }

        .btn:disabled {
            opacity: 0.5;
            cursor: not-allowed;
            transform: none;
        }

        .results-card {
            text-align: center;
            padding: 50px 35px;
        }

        .results-score {
            font-family: 'Libre Baskerville', serif;
            font-size: 5rem;
            color: var(--gold);
            line-height: 1;
            margin-bottom: 10px;
        }

        .results-label {
            font-size: 1.2rem;
            color: rgba(245, 241, 230, 0.7);
            margin-bottom: 30px;
        }

        .results-grade {
            font-family: 'Libre Baskerville', serif;
            font-size: 1.8rem;
            margin-bottom: 15px;
        }

        .results-message {
            font-size: 1.1rem;
            color: rgba(245, 241, 230, 0.8);
            margin-bottom: 40px;
            max-width: 500px;
            margin-left: auto;
            margin-right: auto;
        }

        .stats-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(120px, 1fr));
            gap: 20px;
            margin-bottom: 40px;
        }

        .stat-item {
            background: rgba(10, 22, 40, 0.5);
            padding: 20px;
            border-radius: 12px;
        }

        .stat-value {
            font-family: 'Libre Baskerville', serif;
            font-size: 2rem;
            color: var(--gold);
        }

        .stat-label {
            font-size: 0.8rem;
            color: rgba(245, 241, 230, 0.6);
            text-transform: uppercase;
            letter-spacing: 1px;
            margin-top: 5px;
        }

        .start-screen {
            text-align: center;
            padding: 40px 20px;
        }

        .start-screen h2 {
            font-family: 'Libre Baskerville', serif;
            font-size: 1.8rem;
            margin-bottom: 20px;
            color: var(--cream);
        }

        .start-screen p {
            color: rgba(245, 241, 230, 0.8);
            margin-bottom: 30px;
            max-width: 600px;
            margin-left: auto;
            margin-right: auto;
        }

        .quiz-info {
            display: flex;
            justify-content: center;
            gap: 40px;
            margin-bottom: 40px;
            flex-wrap: wrap;
        }

        .info-item {
            text-align: center;
        }

        .info-value {
            font-family: 'Libre Baskerville', serif;
            font-size: 2.5rem;
            color: var(--gold);
        }

        .info-label {
            font-size: 0.85rem;
            color: rgba(245, 241, 230, 0.6);
            text-transform: uppercase;
            letter-spacing: 2px;
        }

        .categories-list {
            display: flex;
            flex-wrap: wrap;
            justify-content: center;
            gap: 10px;
            margin-bottom: 40px;
        }

        .category-tag {
            background: rgba(201, 162, 39, 0.1);
            color: var(--gold);
            padding: 8px 16px;
            border-radius: 20px;
            font-size: 0.85rem;
        }

        .shuffle-notice {
            background: rgba(45, 138, 123, 0.15);
            border: 1px solid rgba(45, 138, 123, 0.3);
            padding: 12px 20px;
            border-radius: 8px;
            margin-bottom: 30px;
            font-size: 0.9rem;
            color: var(--sea-green);
        }

        .hidden {
            display: none !important;
        }

        @media (max-width: 600px) {
            .container {
                padding: 15px;
            }

            header {
                padding: 30px 15px;
            }

            .question-card {
                padding: 25px 20px;
            }

            .option {
                padding: 15px 18px;
            }

            .score-bar {
                padding: 12px 18px;
            }

            .btn {
                padding: 12px 24px;
                font-size: 0.9rem;
            }

            .nav-buttons {
                flex-direction: column;
            }

            .nav-buttons .btn {
                width: 100%;
            }
        }

        footer {
            text-align: center;
            padding: 40px 20px;
            color: rgba(245, 241, 230, 0.4);
            font-size: 0.85rem;
        }

        footer a {
            color: var(--gold);
            text-decoration: none;
        }
    </style>
</head>
<body>
    <div class="bg-pattern"></div>
    
    <div class="container">
        <header>
            <svg class="logo" viewBox="0 0 100 100" fill="none" xmlns="http://www.w3.org/2000/svg">
                <circle cx="50" cy="50" r="48" stroke="#c9a227" stroke-width="1.5" fill="none"/>
                <circle cx="50" cy="50" r="42" stroke="#c9a227" stroke-width="0.5" fill="none" opacity="0.5"/>
                <path d="M50 8 L53 45 L50 50 L47 45 Z" fill="#c9a227"/>
                <path d="M50 92 L53 55 L50 50 L47 55 Z" fill="#1e3a5f" stroke="#c9a227" stroke-width="0.5"/>
                <path d="M8 50 L45 47 L50 50 L45 53 Z" fill="#1e3a5f" stroke="#c9a227" stroke-width="0.5"/>
                <path d="M92 50 L55 47 L50 50 L55 53 Z" fill="#c9a227"/>
                <path d="M20 20 L46 46 L50 50 L44 46 Z" fill="#c9a227" opacity="0.6"/>
                <path d="M80 20 L54 46 L50 50 L56 46 Z" fill="#c9a227" opacity="0.6"/>
                <path d="M20 80 L46 54 L50 50 L44 54 Z" fill="#c9a227" opacity="0.6"/>
                <path d="M80 80 L54 54 L50 50 L56 54 Z" fill="#c9a227" opacity="0.6"/>
                <circle cx="50" cy="50" r="4" fill="#c9a227"/>
                <text x="50" y="22" text-anchor="middle" fill="#c9a227" font-family="Libre Baskerville" font-size="8">N</text>
                <text x="50" y="88" text-anchor="middle" fill="#c9a227" font-family="Libre Baskerville" font-size="8">S</text>
                <text x="15" y="53" text-anchor="middle" fill="#c9a227" font-family="Libre Baskerville" font-size="8">W</text>
                <text x="85" y="53" text-anchor="middle" fill="#c9a227" font-family="Libre Baskerville" font-size="8">E</text>
            </svg>
            <h1>Yachtmaster Quiz</h1>
            <p class="subtitle">RYA Examination Preparation</p>
        </header>

        <main id="quiz-container"></main>

        <footer>
            <p>Static Quiz Framework • Works Offline • Questions &amp; Answers Randomized</p>
        </footer>
    </div>

    <script>
    // ============================================
    // QUIZ FRAMEWORK - With Full Randomization
    // ============================================
    
    class QuizEngine {
        constructor(quizData, containerId) {
            this.originalQuiz = quizData;
            this.container = document.getElementById(containerId);
            this.currentQuestion = 0;
            this.score = 0;
            this.answered = false;
            this.answers = [];
            this.startTime = null;
            this.endTime = null;
            this.shuffledQuestions = [];
        }

        // Fisher-Yates shuffle
        shuffle(array) {
            const shuffled = [...array];
            for (let i = shuffled.length - 1; i > 0; i--) {
                const j = Math.floor(Math.random() * (i + 1));
                [shuffled[i], shuffled[j]] = [shuffled[j], shuffled[i]];
            }
            return shuffled;
        }

        // Shuffle options while tracking correct answer (skip True/False)
        shuffleOptions(question) {
            // Don't shuffle True/False questions
            if (question.options.length === 2 && 
                question.options[0] === "True" && 
                question.options[1] === "False") {
                return { ...question };
            }
            
            const optionsWithIndex = question.options.map((opt, idx) => ({
                text: opt,
                wasCorrect: idx === question.correct
            }));
            
            const shuffledOptions = this.shuffle(optionsWithIndex);
            const newCorrectIndex = shuffledOptions.findIndex(opt => opt.wasCorrect);
            
            return {
                ...question,
                options: shuffledOptions.map(opt => opt.text),
                correct: newCorrectIndex
            };
        }

        init() {
            this.renderStartScreen();
        }

        renderStartScreen() {
            const categories = [...new Set(this.originalQuiz.questions.map(q => q.category))];
            
            this.container.innerHTML = `
                <div class="question-card start-screen">
                    <h2>${this.originalQuiz.title}</h2>
                    <p>${this.originalQuiz.description}</p>
                    
                    <div class="shuffle-notice">
                        🔀 Questions and answers are randomized each attempt to prevent memorization
                    </div>
                    
                    <div class="quiz-info">
                        <div class="info-item">
                            <div class="info-value">${this.originalQuiz.questions.length}</div>
                            <div class="info-label">Questions</div>
                        </div>
                        <div class="info-item">
                            <div class="info-value">${this.originalQuiz.passingScore}%</div>
                            <div class="info-label">Pass Mark</div>
                        </div>
                    </div>
                    
                    <div class="categories-list">
                        ${categories.map(cat => `<span class="category-tag">${cat}</span>`).join('')}
                    </div>
                    
                    <button class="btn btn-primary" onclick="quiz.startQuiz()">
                        Begin Examination
                    </button>
                </div>
            `;
        }

        startQuiz() {
            this.startTime = new Date();
            this.currentQuestion = 0;
            this.score = 0;
            this.answers = [];
            
            // Shuffle questions and their options
            const shuffledQuestionOrder = this.shuffle(this.originalQuiz.questions);
            this.shuffledQuestions = shuffledQuestionOrder.map(q => this.shuffleOptions(q));
            
            this.renderQuestion();
        }

        renderScoreBar() {
            const progress = ((this.currentQuestion) / this.shuffledQuestions.length) * 100;
            
            return `
                <div class="score-bar">
                    <div class="score-item">
                        <div class="score-label">Score</div>
                        <div class="score-value">${this.score}/${this.currentQuestion}</div>
                    </div>
                    <div class="progress-container">
                        <div class="score-label">Progress</div>
                        <div class="progress-bar">
                            <div class="progress-fill" style="width: ${progress}%"></div>
                        </div>
                    </div>
                    <div class="score-item">
                        <div class="score-label">Remaining</div>
                        <div class="score-value">${this.shuffledQuestions.length - this.currentQuestion}</div>
                    </div>
                </div>
            `;
        }

        renderQuestion() {
            this.answered = false;
            const q = this.shuffledQuestions[this.currentQuestion];
            const letters = ['A', 'B', 'C', 'D', 'E', 'F'];
            
            let imageHtml = '';
            if (q.image) {
                if (q.image.type === 'svg') {
                    imageHtml = `
                        <div class="question-image">
                            ${q.image.data}
                            ${q.image.caption ? `<p class="image-caption">${q.image.caption}</p>` : ''}
                        </div>
                    `;
                } else if (q.image.type === 'url') {
                    imageHtml = `
                        <div class="question-image">
                            <img src="${q.image.data}" alt="${q.image.caption || 'Question image'}">
                            ${q.image.caption ? `<p class="image-caption">${q.image.caption}</p>` : ''}
                        </div>
                    `;
                }
            }

            this.container.innerHTML = `
                ${this.renderScoreBar()}
                <div class="question-card">
                    <div class="question-header">
                        <span class="question-category">${q.category}</span>
                        <span class="question-number">Question ${this.currentQuestion + 1} of ${this.shuffledQuestions.length}</span>
                    </div>
                    
                    <p class="question-text">${q.question}</p>
                    
                    ${imageHtml}
                    
                    <div class="options">
                        ${q.options.map((opt, i) => `
                            <div class="option" data-index="${i}" onclick="quiz.selectAnswer(${i})">
                                <span class="option-letter">${letters[i]}</span>
                                <span class="option-text">${opt}</span>
                            </div>
                        `).join('')}
                    </div>
                    
                    <div id="feedback-area"></div>
                    
                    <div class="nav-buttons" style="margin-top: 25px;">
                        <button class="btn btn-secondary" onclick="quiz.renderStartScreen()">
                            Restart
                        </button>
                        <button class="btn btn-primary" id="next-btn" disabled onclick="quiz.nextQuestion()">
                            ${this.currentQuestion === this.shuffledQuestions.length - 1 ? 'View Results' : 'Next Question'}
                        </button>
                    </div>
                </div>
            `;
        }

        selectAnswer(index) {
            if (this.answered) return;
            this.answered = true;
            
            const q = this.shuffledQuestions[this.currentQuestion];
            const isCorrect = index === q.correct;
            
            if (isCorrect) this.score++;
            
            this.answers.push({
                question: this.currentQuestion,
                selected: index,
                correct: q.correct,
                isCorrect: isCorrect
            });

            const options = document.querySelectorAll('.option');
            options.forEach((opt, i) => {
                opt.classList.add('disabled');
                if (i === q.correct) {
                    opt.classList.add('correct');
                } else if (i === index && !isCorrect) {
                    opt.classList.add('incorrect');
                }
            });

            const feedbackArea = document.getElementById('feedback-area');
            feedbackArea.innerHTML = `
                <div class="feedback ${isCorrect ? 'correct' : 'incorrect'}">
                    <div class="feedback-title">${isCorrect ? '✓ Correct!' : '✗ Incorrect'}</div>
                    <div class="feedback-text">${q.explanation}</div>
                </div>
            `;

            document.getElementById('next-btn').disabled = false;

            const scoreValue = document.querySelector('.score-value');
            if (scoreValue) {
                scoreValue.textContent = `${this.score}/${this.currentQuestion + 1}`;
            }
        }

        nextQuestion() {
            this.currentQuestion++;
            if (this.currentQuestion >= this.shuffledQuestions.length) {
                this.showResults();
            } else {
                this.renderQuestion();
            }
        }

        showResults() {
            this.endTime = new Date();
            const timeTaken = Math.round((this.endTime - this.startTime) / 1000);
            const minutes = Math.floor(timeTaken / 60);
            const seconds = timeTaken % 60;
            const percentage = Math.round((this.score / this.shuffledQuestions.length) * 100);
            const passed = percentage >= this.originalQuiz.passingScore;
            
            let grade, message;
            if (percentage >= 90) {
                grade = 'Distinction';
                message = 'Outstanding performance! You demonstrate excellent knowledge of seamanship and navigation.';
            } else if (percentage >= 75) {
                grade = 'Merit';
                message = 'Well done! You have a strong grasp of the material with room for minor improvements.';
            } else if (percentage >= this.originalQuiz.passingScore) {
                grade = 'Pass';
                message = 'You have demonstrated adequate knowledge. Consider reviewing the topics you found challenging.';
            } else {
                grade = 'Further Study Required';
                message = 'Keep practicing! Review the RYA course materials and try again when ready.';
            }

            const categoryStats = {};
            this.answers.forEach((ans, i) => {
                const cat = this.shuffledQuestions[i].category;
                if (!categoryStats[cat]) {
                    categoryStats[cat] = { correct: 0, total: 0 };
                }
                categoryStats[cat].total++;
                if (ans.isCorrect) categoryStats[cat].correct++;
            });

            this.container.innerHTML = `

            { category: "ColRegs", question: "Rule 18 hierarchy (highest to lowest):", options: ["NUC, RAM, Sailing, Fishing, Power", "RAM, NUC, CBD, Fishing, Sailing, Power", "NUC, RAM, CBD, Fishing, Sailing, Power", "CBD, NUC, RAM, Fishing, Sailing, Power"], correct: 2, explanation: "NUC > RAM > Constrained by Draught > Fishing > Sailing > Power." },
            { category: "ColRegs", question: "Head-on between power vessels: both should:", options: ["Maintain course", "Alter to starboard", "Alter to port", "Stop"], correct: 1, explanation: "Rule 14: Both alter to STARBOARD to pass port-to-port." },
            { category: "ColRegs", question: "Which is 'Restricted in Ability to Manoeuvre'?", options: ["Vessel at anchor", "Vessel dredging", "Sailing yacht", "Vessel in narrow channel"], correct: 1, explanation: "RAM: dredging, cable laying, surveying, replenishment at sea, aircraft ops, minesweeping, restricted towing." },
            { category: "ColRegs", question: "Stand-on vessel MUST act when:", options: ["Never", "Give-way vessel clearly not acting", "Only in restricted visibility", "Only in TSS"], correct: 1, explanation: "Rule 17: Stand-on MUST act when give-way vessel is clearly not taking action." },
            { category: "ColRegs", question: "In a narrow channel:", options: ["Keep to starboard", "Vessels <20m must not impede", "Maximum speed required", "Anchoring permitted"], correct: 1, explanation: "Rule 9: Vessels <20m and sailing vessels must not impede vessels confined to channel." },
            { category: "ColRegs", question: "Two sailing vessels, same tack. Right of way goes to:", options: ["Windward vessel", "Leeward vessel", "Faster vessel", "Larger vessel"], correct: 1, explanation: "Rule 12: Same tack = LEEWARD vessel has right of way." },
            
            // SOUND SIGNALS (8)
            { category: "Sound Signals", question: "Power vessel making way in fog sounds:", options: ["1 prolonged every 2 min", "2 prolonged every 2 min", "1 prolonged every 1 min", "3 short every 2 min"], correct: 0, explanation: "Rule 35(a): Power vessel making way = 1 prolonged blast ≤2 minutes." },
            { category: "Sound Signals", question: "Five or more short rapid blasts means:", options: ["Altering starboard", "Operating astern", "Danger signal/doubt", "At anchor"], correct: 2, explanation: "5+ short rapid blasts = DANGER signal (Rule 34d). 'Wake up!'" },
            { category: "Sound Signals", image: { type: "svg", data: `<svg viewBox="0 0 380 140" xmlns="http://www.w3.org/2000/svg" style="background:#0a1628;max-width:380px"><text x="190" y="22" fill="#c9a227" font-size="13" text-anchor="middle" font-weight="bold">Manoeuvring Signals</text><g transform="translate(25,45)"><rect x="0" y="0" width="70" height="18" fill="#2d8a7b" rx="2"/><text x="35" y="38" fill="#f5f1e6" font-size="9" text-anchor="middle">PROLONGED</text><text x="35" y="50" fill="#f5f1e6" font-size="8" text-anchor="middle">(4-6 sec)</text></g><g transform="translate(120,45)"><rect x="0" y="0" width="18" height="18" fill="#c9a227" rx="2"/><text x="9" y="38" fill="#f5f1e6" font-size="9" text-anchor="middle">SHORT</text><text x="9" y="50" fill="#f5f1e6" font-size="8" text-anchor="middle">(1 sec)</text></g><g transform="translate(180,45)"><rect x="0" y="0" width="18" height="18" fill="#c9a227" rx="2"/><text x="55" y="13" fill="#f5f1e6" font-size="9">= Starboard</text></g><g transform="translate(180,75)"><rect x="0" y="0" width="18" height="18" fill="#c9a227" rx="2"/><rect x="24" y="0" width="18" height="18" fill="#c9a227" rx="2"/><text x="70" y="13" fill="#f5f1e6" font-size="9">= Port</text></g><g transform="translate(180,105)"><rect x="0" y="0" width="18" height="18" fill="#c9a227" rx="2"/><rect x="24" y="0" width="18" height="18" fill="#c9a227" rx="2"/><rect x="48" y="0" width="18" height="18" fill="#c9a227" rx="2"/><text x="85" y="13" fill="#f5f1e6" font-size="9">= Astern</text></g></svg>`, caption: "Manoeuvring signals" }, question: "'I am operating astern propulsion' signal:", options: ["1 short", "2 short", "3 short", "1 prolonged"], correct: 2, explanation: "3 short blasts = operating astern propulsion (Rule 34a)." },
            { category: "Sound Signals", question: "Vessel at anchor in fog sounds:", options: ["1 prolonged/2 min", "Bell rapidly 5 sec/min", "2 prolonged/2 min", "1 short, 1 long, 1 short"], correct: 1, explanation: "Rule 35(g): Anchor = rapid bell ringing ~5 seconds every ≤1 minute." },
            { category: "Sound Signals", question: "Power vessel stopped (not making way) in fog:", options: ["1 prolonged/2 min", "2 prolonged/2 min", "Bell/min", "3 short/2 min"], correct: 1, explanation: "Rule 35(b): Power vessel stopped = 2 prolonged blasts (2 sec gap) ≤2 minutes." },
            { category: "Sound Signals", question: "Vessel aground in fog includes:", options: ["Bell only", "Gong only", "3 bell strokes + rapid bell + 3 strokes", "Continuous horn"], correct: 2, explanation: "Aground: 3 distinct bell strokes, rapid ringing 5 sec, 3 more strokes." },
            { category: "Sound Signals", question: "Sailing vessel in fog sounds:", options: ["1 prolonged/2 min", "1 prolonged + 2 short/2 min", "3 short/min", "No signal"], correct: 1, explanation: "Rule 35(c): Sail, fishing, NUC, RAM, CBD, towing = 1 prolonged + 2 short." },
            { category: "Sound Signals", question: "A prolonged blast duration is:", options: ["1 second", "2-3 seconds", "4-6 seconds", "10 seconds"], correct: 2, explanation: "Prolonged = 4-6 seconds. Short = ~1 second." },
            
            // NAVIGATION LIGHTS (8)
            { category: "Navigation Lights", question: "Green light + white light higher behind = you're seeing:", options: ["Power, port side", "Power, starboard side", "Sail, port side", "Sail, starboard side"], correct: 1, explanation: "Green = starboard. White masthead = power. You see power vessel's starboard side." },
            { category: "Navigation Lights", image: { type: "svg", data: `<svg viewBox="0 0 380 180" xmlns="http://www.w3.org/2000/svg" style="background:#0a1628;max-width:380px"><text x="190" y="18" fill="#c9a227" font-size="11" text-anchor="middle" font-weight="bold">Identify These Vessels</text><g transform="translate(55,55)"><circle cx="0" cy="0" r="7" fill="#fff"/><circle cx="-13" cy="26" r="5" fill="#e05858"/><circle cx="13" cy="26" r="5" fill="#2d8a7b"/><circle cx="0" cy="30" r="4" fill="#fff" opacity="0.6"/><text x="0" y="60" fill="#f5f1e6" font-size="9" text-anchor="middle">A</text></g><g transform="translate(145,55)"><circle cx="-13" cy="26" r="5" fill="#e05858"/><circle cx="13" cy="26" r="5" fill="#2d8a7b"/><circle cx="0" cy="30" r="4" fill="#fff" opacity="0.6"/><text x="0" y="60" fill="#f5f1e6" font-size="9" text-anchor="middle">B</text></g><g transform="translate(235,55)"><circle cx="0" cy="0" r="7" fill="#2d8a7b"/><circle cx="0" cy="16" r="5" fill="#fff"/><circle cx="-13" cy="36" r="4" fill="#e05858"/><circle cx="13" cy="36" r="4" fill="#2d8a7b"/><text x="0" y="65" fill="#f5f1e6" font-size="9" text-anchor="middle">C</text></g><g transform="translate(325,55)"><circle cx="0" cy="0" r="7" fill="#e05858"/><circle cx="0" cy="16" r="7" fill="#e05858"/><text x="0" y="50" fill="#f5f1e6" font-size="9" text-anchor="middle">D</text></g><g transform="translate(45,130)"><circle cx="0" cy="0" r="4" fill="#fff"/><text x="12" y="4" fill="#f5f1e6" font-size="9">White</text><circle cx="70" cy="0" r="4" fill="#e05858"/><text x="82" y="4" fill="#f5f1e6" font-size="9">Red</text><circle cx="130" cy="0" r="4" fill="#2d8a7b"/><text x="142" y="4" fill="#f5f1e6" font-size="9">Green</text></g></svg>`, caption: "Vessel identification by lights" }, question: "Vessel C (green over white + sidelights) is:", options: ["Power <50m", "Trawling", "At anchor", "Pilot vessel"], correct: 1, explanation: "Green over White = TRAWLING. 'Green over White, trawling tonight.'" },
            { category: "Navigation Lights", question: "Two red lights vertically indicate:", options: ["RAM", "NUC", "Aground", "CBD"], correct: 1, explanation: "Two all-round RED vertical = Not Under Command. Day: two balls." },
            { category: "Navigation Lights", question: "Red-White-Red vertically + steaming lights =", options: ["NUC", "RAM", "Fishing", "CBD"], correct: 1, explanation: "Red-White-Red = Restricted in Ability to Manoeuvre." },
            { category: "Navigation Lights", question: "Masthead light arc:", options: ["360°", "225°", "135°", "112.5°"], correct: 1, explanation: "Masthead light shows 225° - ahead to 22.5° abaft beam each side." },
            { category: "Navigation Lights", question: "Each sidelight arc:", options: ["180°", "135°", "112.5°", "90°"], correct: 2, explanation: "Sidelights show 112.5° each - ahead to 22.5° abaft beam on their side." },
            { category: "Navigation Lights", question: "Vessel <50m at anchor shows:", options: ["1 all-round white", "2 all-round white vertical", "Sidelights only", "Flashing yellow"], correct: 0, explanation: "Under 50m anchor = one all-round white where best seen." },
            { category: "Navigation Lights", question: "Three red lights vertically indicate:", options: ["NUC", "RAM", "CBD", "Aground"], correct: 3, explanation: "Three all-round RED vertical = AGROUND. Day: three balls." },
            
            // NAVIGATION AIDS (8)
            { category: "Navigation Aids", question: "AIS does NOT provide:", options: ["Name and MMSI", "SOG and COG", "Depth under keel", "Position"], correct: 2, explanation: "AIS provides vessel info, dynamic data, voyage data - NOT depth under keel." },
            { category: "Navigation Aids", question: "Sea clutter on radar appears as:", options: ["Single strong return", "Multiple scattered returns near centre", "Line along coast", "Regular pattern"], correct: 1, explanation: "Sea clutter: scattered returns from waves near display centre. Use STC control." },
            { category: "Navigation Aids", question: "RACON appears on radar as:", options: ["Circle around mark", "Line of dashes outward from mark", "Blinking dot", "Solid connecting line"], correct: 1, explanation: "RACON: coded response (dashes/Morse letter) extending OUTWARD from mark." },
            { category: "Navigation Aids", question: "ARPA primarily provides:", options: ["Image enhancement", "Target tracking and CPA/TCPA", "Chart overlay", "Clutter filtering"], correct: 1, explanation: "ARPA tracks targets, calculates course, speed, CPA, TCPA for collision avoidance." },

            { category: "Navigation Aids", question: "MMSI is:", options: ["9-digit vessel radio ID", "Radio call sign", "Registration number", "IMO number"], correct: 0, explanation: "MMSI: unique 9-digit Maritime Mobile Service Identity for DSC/AIS." },
            { category: "Navigation Aids", question: "Radar blind sector is caused by:", options: ["Equipment fault", "Physical obstructions on vessel", "Sea clutter", "Rain"], correct: 1, explanation: "Blind sectors: areas radar can't see due to masts, funnels, deck cargo on your vessel." },
            { category: "Navigation Aids", question: "COG stands for:", options: ["Change Of Gear", "Course Over Ground", "Compass Original Gradient", "Central Operating Grid"], correct: 1, explanation: "COG = Course Over Ground (actual direction of travel over seabed)." },
            
            // SAFETY (10)
            { category: "Safety", question: "Fire parachute flare aiming:", options: ["Vertical regardless of wind", "Downwind 15°", "Slightly into wind", "Horizontal toward vessel"], correct: 2, explanation: "Fire INTO wind ~15° from vertical. Wind carries it to vertical at max height." },
            { category: "Safety", question: "International VHF distress/safety channel:", options: ["Ch 67", "Ch 16", "Ch 12", "Ch 06"], correct: 1, explanation: "Channel 16 (156.8 MHz) is international distress, safety, calling frequency." },
            { category: "Safety", question: "MAYDAY indicates:", options: ["Urgency", "Safety warning", "Grave imminent danger", "Radio check request"], correct: 2, explanation: "MAYDAY = DISTRESS: grave and imminent danger requiring immediate assistance." },
            { category: "Safety", question: "EPIRB transmits on:", options: ["VHF Ch 16", "406 MHz to satellites", "MF 2182 kHz", "HF frequencies"], correct: 1, explanation: "EPIRBs transmit 406 MHz to COSPAS-SARSAT satellites. Many also have 121.5 MHz homing." },
            { category: "Safety", question: "MAYDAY call begins:", options: ["MAYDAY x3, This is [name x3]", "MAYDAY, This is, MAYDAY x2", "This is, MAYDAY x3", "HELP x3, This is"], correct: 0, explanation: "MAYDAY MAYDAY MAYDAY, This is [vessel name x3], MAYDAY [name], position..." },
            { category: "Safety", question: "DSC distress alert channel:", options: ["VHF Ch 16", "VHF Ch 70", "VHF Ch 13", "MF 2187.5 only"], correct: 1, explanation: "DSC distress alerts on Ch 70. Voice follows on Ch 16." },

            { category: "Safety", question: "Hypothermia risk exists in water below:", options: ["25°C", "20°C", "15°C", "Any temperature below body temp"], correct: 3, explanation: "Any water below body temp (37°C) causes hypothermia. Colder = faster heat loss." },

            { category: "Navigation Aids", question: "True or False: GPS is always more accurate than radar fixes.", options: ["True", "False"], correct: 1, explanation: "FALSE. GPS can have errors; good radar fix may be more reliable. Cross-check!" },

            { category: "ColRegs", question: "True or False: In restricted visibility, all vessels must proceed at safe speed.", options: ["True", "False"], correct: 0, explanation: "TRUE. Rule 19: Safe speed, engines ready, adapted to conditions." },
            { category: "Safety", question: "True or False: Red flares should only be used in grave imminent danger.", options: ["True", "False"], correct: 0, explanation: "TRUE. Red distress flares only for genuine distress. Misuse is an offence." },
            { category: "Navigation Lights", question: "True or False: Sailing vessel motoring must show power vessel lights.", options: ["True", "False"], correct: 0, explanation: "TRUE. Under power = power-driven vessel, must show masthead light(s)." },
